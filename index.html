<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinetic Film</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#F0EBE1;--ink:#1a1a18;--ui:#faf8f4;--ub:#e4dfd6;--ut:#46433d;--um:#9e9892;
  --c-green:#34d399;--c-blue:#3b82f6;--c-amber:#f59e0b;--c-cyan:#06b6d4;--c-red:#ef4444;--c-purple:#a78bfa}
body{background:#d8d3c8;font-family:'DM Sans',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── TOPBAR ── */
.topbar{height:44px;background:var(--ui);border-bottom:1px solid var(--ub);display:flex;align-items:center;padding:0 14px;gap:9px;flex-shrink:0}
.brand{font-size:12.5px;font-weight:500;letter-spacing:-.02em;color:var(--ink)}
.tsep{width:1px;height:16px;background:var(--ub)}
.tbtn{padding:4px 12px;border-radius:100px;font-size:11.5px;font-family:inherit;cursor:pointer;border:1px solid var(--ub);background:transparent;color:var(--ut);transition:background .12s}
.tbtn:hover{background:var(--ub)}
.tbtn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbtn.pri:hover{background:#2c2c28}
.sp{flex:1}
.spd{background:transparent;border:1px solid var(--ub);border-radius:6px;color:var(--ut);font-size:11.5px;font-family:inherit;padding:3px 7px;cursor:pointer;outline:none}

/* ── MAIN ── */
.main{display:flex;flex:1;overflow:hidden;min-height:0}

/* ── SIDEBAR ── */
.sb{width:340px;flex-shrink:0;background:var(--ui);border-right:1px solid var(--ub);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.sbh{padding:11px 13px 9px;border-bottom:1px solid var(--ub);flex-shrink:0}
.sbh h2{font-size:11.5px;font-weight:500;color:var(--ut);margin-bottom:2px}
.sbhi{font-size:10px;color:var(--um);line-height:1.6}
.sbhi code{background:var(--ub);padding:0 3px;border-radius:3px;font-size:9.5px}
.sbl{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:5px;min-height:0}
.sbl::-webkit-scrollbar{width:6px}
.sbl::-webkit-scrollbar-track{background:transparent}
.sbl::-webkit-scrollbar-thumb{background:#c4bfb6;border-radius:3px}
.sbl::-webkit-scrollbar-thumb:hover{background:#a9a49b}

/* scene cards */
.sc{background:#fff;border:1.5px solid var(--ub);border-radius:9px;overflow:hidden;transition:border-color .15s;flex-shrink:0}
.sc.act{border-color:#a09890}
.sch{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer;user-select:none}
.scn{width:18px;height:18px;border-radius:50%;background:var(--ub);display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:600;color:var(--ut);flex-shrink:0}
.sc.act .scn{background:var(--ink);color:#fff}
.scp{font-size:11px;color:var(--ut);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scm{font-size:7.5px;padding:2px 5px;border-radius:100px;background:var(--ub);color:var(--um);text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}

/* expanded scene body */
.scb{padding:10px 10px 12px;border-top:1px solid var(--ub);display:flex;flex-direction:column;gap:6px}
.sec{display:flex;flex-direction:column;gap:5px;border:1px solid var(--ub);border-radius:7px;overflow:hidden}
.sec-title{font-size:9.5px;color:var(--um);font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:7px 9px;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between;background:var(--ui);transition:background .1s}
.sec-title:hover{background:var(--ub)}
.sec-title::after{content:'▸';font-size:10px;color:var(--um);transition:transform .15s}
.sec.open .sec-title::after{transform:rotate(90deg)}
.sec-body{display:none;padding:7px 9px 9px}
.sec.open .sec-body{display:block}
.fl{display:flex;align-items:flex-start;gap:7px}
.fl label{font-size:9.5px;color:var(--um);width:48px;flex-shrink:0;padding-top:5px}
.fl textarea{flex:1;background:var(--ui);border:1px solid var(--ub);border-radius:6px;color:var(--ink);font-family:inherit;font-size:12px;padding:6px 8px;outline:none;resize:none;min-height:52px;line-height:1.5}
.fl textarea:focus{border-color:#aaa}
.fl input[type=range]{flex:1;accent-color:var(--ink);margin-top:7px}
.pr{display:flex;gap:3px;flex-wrap:wrap}
.ap{font-size:8.5px;padding:3px 8px;border-radius:100px;border:1px solid var(--ub);background:var(--ui);color:var(--ut);cursor:pointer;font-family:inherit;transition:all .1s;white-space:nowrap}
.ap.s{background:var(--ink);color:#fff;border-color:var(--ink)}
.ap:hover:not(.s){background:var(--ub)}
.rv{font-size:9.5px;color:var(--um);padding-top:7px;min-width:28px;text-align:right}

/* background swatches */
.bg-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bg-sw{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--ub);cursor:pointer;transition:all .15s;position:relative}
.bg-sw:hover{transform:scale(1.15)}
.bg-sw.s{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.bg-sw.product-sw::after{content:'';position:absolute;inset:4px;border:1px solid rgba(255,255,255,.3);border-radius:2px}
.bg-custom{width:24px;height:24px;border:2px solid var(--ub);padding:0;border-radius:50%;cursor:pointer;overflow:hidden;background:none;-webkit-appearance:none;appearance:none}
.bg-custom::-webkit-color-swatch-wrapper{padding:0}
.bg-custom::-webkit-color-swatch{border:none;border-radius:50%}

/* scene actions */
.sdel{align-self:flex-start;background:none;border:1px solid #eedede;border-radius:6px;padding:4px 10px;font-size:10.5px;color:#c44;cursor:pointer;font-family:inherit}
.sdel:hover{background:#fff0f0}
.addbtn{background:none;border:1.5px dashed var(--ub);border-radius:9px;padding:9px;font-size:11.5px;color:var(--um);cursor:pointer;font-family:inherit;text-align:center;transition:all .15s}
.addbtn:hover{border-color:#aaa;color:var(--ut)}

/* ── CANVAS ── */
.cw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
.film{position:relative;width:100%;max-width:900px;aspect-ratio:16/9;background:var(--cream);border-radius:11px;overflow:hidden;box-shadow:0 10px 44px rgba(0,0,0,.15),0 2px 8px rgba(0,0,0,.07)}
#stage{position:absolute;inset:0;overflow:hidden;transition:background .5s ease}

/* word element */
.w{display:inline-block;font-family:'DM Sans',sans-serif;color:var(--ink);white-space:nowrap;will-change:transform,opacity,filter;line-height:1.2;transition:color 0s}
.w.pill{background:rgba(26,26,24,.065);border:1.5px solid rgba(26,26,24,.2);border-radius:100px;padding:.06em .44em}

/* dark mode for stage */
#stage.dark-bg .w{color:#fff}
#stage.dark-bg .w.pill{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
#stage.dark-bg .prog{background:rgba(255,255,255,.12)}
#stage.dark-bg .ctr{color:rgba(255,255,255,.15)}

/* product wireframe overlay */
.product-overlay{position:absolute;inset:10% 7%;border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden;pointer-events:none;z-index:0}
.po-nav{height:7%;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;padding:0 3%;gap:1.2%}
.po-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.08)}
.po-navline{flex:1;height:3px;background:rgba(255,255,255,.025);border-radius:2px;margin-left:3%}
.po-body{display:flex;height:93%}
.po-side{width:15%;border-right:1px solid rgba(255,255,255,.035);padding:6% 2.5%;display:flex;flex-direction:column;gap:7%}
.po-si{height:3px;background:rgba(255,255,255,.035);border-radius:2px;width:75%}
.po-si:nth-child(3){width:55%}
.po-main{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:5%;padding:6% 6% 10%}
.po-bar{flex:1;border-radius:3px 3px 0 0}
.po-bar:nth-child(1){background:rgba(255,255,255,.035);height:30%}
.po-bar:nth-child(2){background:rgba(255,255,255,.04);height:50%}
.po-bar:nth-child(3){background:rgba(52,211,153,.1);height:78%}
.po-bar:nth-child(4){background:rgba(255,255,255,.04);height:42%}
.po-bar:nth-child(5){background:rgba(255,255,255,.035);height:60%}
.po-bar:nth-child(6){background:rgba(52,211,153,.08);height:88%}
.po-bar:nth-child(7){background:rgba(255,255,255,.03);height:35%}

/* progress + counter */
.prog{position:absolute;bottom:0;left:0;height:2.5px;background:rgba(26,26,24,.2);width:0%;border-radius:0 2px 0 0;z-index:5}
.ctr{position:absolute;bottom:9px;right:12px;font-size:8.5px;color:rgba(26,26,24,.18);letter-spacing:.04em;z-index:5}

/* idle overlay */
.idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:opacity .4s ease;z-index:10}
.idle.gone{opacity:0;pointer-events:none}
.idlep{width:52px;height:52px;border-radius:50%;background:rgba(26,26,24,.07);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease}
.idlep:hover{background:rgba(26,26,24,.14);transform:scale(1.08)}
.idlel{font-size:9.5px;color:rgba(26,26,24,.28);letter-spacing:.07em;text-transform:uppercase}

/* controls */
.ctrl{display:flex;align-items:center;gap:7px;background:var(--ui);border:1px solid var(--ub);border-radius:100px;padding:5px 11px;box-shadow:0 2px 7px rgba(0,0,0,.06)}
.cbtn{background:none;border:none;cursor:pointer;font-size:11.5px;color:var(--ut);padding:3px 6px;border-radius:4px;transition:background .1s}
.cbtn:hover{background:var(--ub)}
.pbtn{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s ease}
.pbtn:hover{background:#2c2c28;transform:scale(1.06)}
.tl{display:flex;gap:4px;align-items:center;padding:0 3px}
.pip{width:5px;height:5px;border-radius:50%;background:var(--ub);cursor:pointer;transition:all .2s ease}
.pip.d{background:var(--um)}
.pip.c{background:var(--ink);transform:scale(1.4)}
.tt{font-size:10.5px;color:var(--um);min-width:26px;text-align:center}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">Kinetic Film</span>
  <div class="tsep"></div>
  <button class="tbtn" onclick="addScene()">+ Scene</button>
  <div class="sp"></div>
  <span style="font-size:11px;color:var(--um);margin-right:2px">Hastighet</span>
  <select class="spd" id="spd" onchange="calcTime()">
    <option value=".5">Sakte</option>
    <option value=".75">Litt sakt</option>
    <option value="1" selected>Normal</option>
    <option value="1.5">Rask</option>
    <option value="2">Veldig rask</option>
  </select>
  <div class="tsep"></div>
  <button class="tbtn pri" onclick="playAll()">&#9654; Spill av</button>
</div>

<div class="main">
  <div class="sb">
    <div class="sbh">
      <h2>Manuskript</h2>
      <div class="sbhi"><code>[ord]</code> pill &nbsp;&middot;&nbsp; <code>ord~green</code> farge &nbsp;&middot;&nbsp; <code>|</code> split</div>
    </div>
    <div class="sbl" id="list"></div>
  </div>
  <div class="cw">
    <div class="film">
      <div id="stage"></div>
      <div class="prog" id="prog"></div>
      <div class="ctr" id="ctr"></div>
      <div class="idle" id="idle">
        <button class="idlep" onclick="playAll()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#1a1a18"><polygon points="5,3 20,12 5,21"/></svg>
        </button>
        <div class="idlel">Trykk for &aring; spille av</div>
      </div>
    </div>
    <div class="ctrl">
      <button class="cbtn" onclick="go(-1)">&#9664;</button>
      <button class="pbtn" onclick="togglePlay()">
        <svg width="12" height="12" viewBox="0 0 24 24"><polygon id="pico" points="5,3 20,12 5,21" fill="white"/></svg>
      </button>
      <button class="cbtn" onclick="go(1)">&#9654;</button>
      <div class="tl" id="tl"></div>
      <span class="tt" id="tt">0:00</span>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  EASING
// ═══════════════════════════════════════════════════════
const EO   = 'cubic-bezier(0.25,0.46,0.45,0.94)';
const EI   = 'cubic-bezier(0.55,0.0,1.0,0.45)';
const SP   = 'cubic-bezier(0.34,1.52,0.64,1)';
const SN   = 'cubic-bezier(0.22,1,0.36,1)';
const EL   = 'cubic-bezier(0.68,-0.55,0.27,1.55)';
const SNAP = 'cubic-bezier(0.16,1,0.3,1)';
const SILK = 'cubic-bezier(0.45,0,0.15,1)';
const EXPO = 'cubic-bezier(0.16,1,0.3,1)';
const BACK = 'cubic-bezier(0.34,1.56,0.64,1)';

// ═══════════════════════════════════════════════════════
//  SIZE + COLOR
// ═══════════════════════════════════════════════════════
const SCALES = {xs:.55, sm:.78, md:1, lg:1.5, xl:2.2, '2xl':3.5, '3xl':5};
const COLORS = {green:'#34d399',blue:'#3b82f6',amber:'#f59e0b',cyan:'#06b6d4',red:'#ef4444',purple:'#a78bfa',white:'#ffffff'};
function baseFS(){ return Math.min(stage.offsetWidth*0.036,30); }

// ═══════════════════════════════════════════════════════
//  ENTRANCE MODES  (21 total)
// ═══════════════════════════════════════════════════════
const ENTER = {
  gentle(els){let m=0;els.forEach(({el},i)=>{el.animate([{opacity:0,transform:'translateY(10px)',filter:'blur(2px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:320,delay:i*120,easing:SNAP,fill:'both'});m=Math.max(m,i*120+320)});return m},
  together(els){els.forEach(({el})=>el.animate([{opacity:0,transform:'scale(0.92) translateY(6px)',filter:'blur(3px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:350,easing:SNAP,fill:'both'}));return 350},
  typewriter(els){const al=[];els.forEach(({el})=>{el.style.opacity='1';const t=el.textContent;el.textContent='';[...t].forEach(ch=>{const l=document.createElement('span');l.style.cssText='display:inline-block;opacity:0;transform:translateY(3px);';if(el.style.color)l.style.color=el.style.color;l.textContent=ch;el.appendChild(l);al.push(l)});const s=document.createElement('span');s.style.cssText='display:inline-block;width:.28em;opacity:1;';el.appendChild(s)});const ms=38;al.forEach((l,i)=>l.animate([{opacity:0,transform:'translateY(3px)'},{opacity:1,transform:'none'}],{duration:50,delay:i*ms,easing:'ease-out',fill:'both'}));return al.length*ms+50},
  assemble(els){const W=stage.offsetWidth,H=stage.offsetHeight;els.forEach(({el},i)=>{const sx=(Math.random()-.5)*W*.7,sy=(Math.random()-.5)*H*.6,r=(Math.random()-.5)*30;el.animate([{opacity:0,transform:`translate(${sx}px,${sy}px) rotate(${r}deg) scale(.4)`,filter:'blur(6px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:500,delay:i*60,easing:SNAP,fill:'both'})});return els.length*60+500},
  rise(els){let m=0;els.forEach(({el},i)=>{el.animate([{opacity:0,transform:'translateY(40px) scale(0.9)',filter:'blur(4px)'},{opacity:1,transform:'translateY(-3px) scale(1)',filter:'blur(0)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:450,delay:i*100,easing:SNAP,fill:'both'});m=Math.max(m,i*100+450)});return m},
  zoom(els){let m=0;els.forEach(({el},i)=>{el.animate([{opacity:0,transform:'scale(0.1)',filter:'blur(8px)'},{opacity:1,transform:'scale(1.06)',filter:'blur(0)'},{opacity:1,transform:'scale(1)',filter:'blur(0)'}],{duration:500,delay:i*80,easing:BACK,fill:'both'});m=Math.max(m,i*80+500)});return m},
  flip(els){let m=0;els.forEach(({el},i)=>{el.style.transformOrigin='center top';el.animate([{opacity:0,transform:'perspective(600px) rotateX(-80deg) translateY(-10px)'},{opacity:1,transform:'perspective(600px) rotateX(5deg) translateY(0)'},{opacity:1,transform:'perspective(600px) rotateX(0)'}],{duration:550,delay:i*90,easing:SNAP,fill:'both'});m=Math.max(m,i*90+550)});return m},
  wave(els){let m=0;const c=els.length/2;els.forEach(({el},i)=>{const d=Math.abs(i-c)*100,y=Math.sin((i/els.length)*Math.PI)*30+15;el.animate([{opacity:0,transform:`translateY(${y}px) scale(0.8)`},{opacity:1,transform:'translateY(-4px) scale(1.02)'},{opacity:1,transform:'none'}],{duration:450,delay:d,easing:SNAP,fill:'both'});m=Math.max(m,d+450)});return m},
  elastic(els){let m=0;els.forEach(({el},i)=>{el.animate([{opacity:0,transform:'translateX(-60px) scale(0.7)'},{opacity:1,transform:'translateX(8px) scale(1.03)'},{opacity:1,transform:'translateX(-2px) scale(1)'},{opacity:1,transform:'none'}],{duration:550,delay:i*80,easing:SILK,fill:'both'});m=Math.max(m,i*80+550)});return m},
  blur(els){let m=0;els.forEach(({el},i)=>{el.animate([{opacity:0,filter:'blur(20px)',transform:'scale(1.15)'},{opacity:.7,filter:'blur(4px)',transform:'scale(1.03)'},{opacity:1,filter:'blur(0)',transform:'none'}],{duration:500,delay:i*100,easing:SILK,fill:'both'});m=Math.max(m,i*100+500)});return m},
  cascade(els){let m=0;els.forEach(({el},i)=>{el.animate([{opacity:0,transform:'translateY(-50px) rotate(-5deg)',filter:'blur(3px)'},{opacity:1,transform:'translateY(4px) rotate(.5deg)',filter:'blur(0)'},{opacity:1,transform:'none'}],{duration:400,delay:i*70,easing:BACK,fill:'both'});m=Math.max(m,i*70+400)});return m},
  slam(els){let m=0;els.forEach(({el},i)=>{el.animate([{opacity:0,transform:'scale(3) translateY(-20px)',filter:'blur(10px)'},{opacity:1,transform:'scale(.95)',filter:'blur(0)'},{opacity:1,transform:'scale(1)'}],{duration:350,delay:i*120,easing:SNAP,fill:'both'});m=Math.max(m,i*120+350)});return m},
  glitch(els){let m=0;els.forEach(({el},i)=>{const d=i*60;el.animate([{opacity:0,transform:'translateX(10px) skewX(20deg)',filter:'blur(0)'},{opacity:1,transform:'translateX(-5px) skewX(-10deg)',filter:'blur(2px)'},{opacity:0,transform:'translateX(3px) skewX(5deg)',filter:'blur(0)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:300,delay:d,easing:'linear',fill:'both'});m=Math.max(m,d+300)});return m},
  spiral(els){let m=0;els.forEach(({el},i)=>{const a=(Math.random()-.5)*360,dist=80+Math.random()*60,rad=a*Math.PI/180;el.animate([{opacity:0,transform:`translate(${Math.cos(rad)*dist}px,${Math.sin(rad)*dist}px) rotate(${a}deg) scale(0.3)`},{opacity:1,transform:'translate(0,0) rotate(0deg) scale(1)'}],{duration:600,delay:i*70,easing:SNAP,fill:'both'});m=Math.max(m,i*70+600)});return m},
  cut(els){els.forEach(({el})=>{el.style.opacity='1'});return 10},
  // ── NEW ──
  bounce(els){let m=0;els.forEach(({el},i)=>{el.animate([{opacity:0,transform:'translateY(-60px)'},{opacity:1,transform:'translateY(8px)'},{opacity:1,transform:'translateY(-3px)'},{opacity:1,transform:'translateY(0)'}],{duration:500,delay:i*80,easing:SILK,fill:'both'});m=Math.max(m,i*80+500)});return m},
  reveal(els){let m=0;els.forEach(({el},i)=>{el.animate([{opacity:0,transform:'scaleX(0)',filter:'blur(4px)'},{opacity:1,transform:'scaleX(1)',filter:'blur(0)'}],{duration:400,delay:i*60,easing:SNAP,fill:'both'});m=Math.max(m,i*60+400)});return m},
  swing(els){let m=0;els.forEach(({el},i)=>{el.style.transformOrigin='center top';el.animate([{opacity:0,transform:'rotate(-15deg)'},{opacity:1,transform:'rotate(5deg)'},{opacity:1,transform:'rotate(-2deg)'},{opacity:1,transform:'rotate(0)'}],{duration:500,delay:i*90,easing:SILK,fill:'both'});m=Math.max(m,i*90+500)});return m},
  drop(els){let m=0;els.forEach(({el},i)=>{el.animate([{opacity:0,transform:'translateY(-80px) scale(0.8)'},{opacity:1,transform:'translateY(5px) scale(1.02)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:400,delay:i*100,easing:SNAP,fill:'both'});m=Math.max(m,i*100+400)});return m},
  expand(els){let m=0;els.forEach(({el},i)=>{el.animate([{opacity:0,transform:'scaleY(0.2) scaleX(1.3)',filter:'blur(2px)'},{opacity:1,transform:'scaleY(1.05) scaleX(.98)',filter:'blur(0)'},{opacity:1,transform:'scale(1)'}],{duration:400,delay:i*70,easing:BACK,fill:'both'});m=Math.max(m,i*70+400)});return m},

let holdAnims=[];
const HOLD = {
  none(){},
  float(els){els.forEach(({el},i)=>{holdAnims.push(el.animate([{transform:'translateY(0)'},{transform:'translateY(-6px)'},{transform:'translateY(0)'}],{duration:2200+i*200,iterations:Infinity,easing:SILK,delay:i*150}))})},
  breathe(els){els.forEach(({el},i)=>{holdAnims.push(el.animate([{transform:'scale(1)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:2800+i*300,iterations:Infinity,easing:SILK,delay:i*200}))})},
  wave(els){els.forEach(({el},i)=>{holdAnims.push(el.animate([{transform:'translateY(0)'},{transform:'translateY(-8px)'},{transform:'translateY(0)'}],{duration:1600,iterations:Infinity,easing:SILK,delay:i*180}))})},
  pulse(els){els.forEach(({el},i)=>{holdAnims.push(el.animate([{opacity:1,filter:'brightness(1)'},{opacity:.85,filter:'brightness(1.1)'},{opacity:1,filter:'brightness(1)'}],{duration:2000,iterations:Infinity,easing:SILK,delay:i*250}))})},
  sway(els){els.forEach(({el},i)=>{const d=i%2===0?1:-1;holdAnims.push(el.animate([{transform:'translateX(0) rotate(0deg)'},{transform:`translateX(${d*5}px) rotate(${d*1}deg)`},{transform:'translateX(0) rotate(0deg)'}],{duration:2600+i*200,iterations:Infinity,easing:SILK,delay:i*150}))})},
  jitter(els){els.forEach(({el},i)=>{const jit=()=>{const x=(Math.random()-.5)*2,y=(Math.random()-.5)*2;holdAnims.push(el.animate([{transform:`translate(${x}px,${y}px)`}],{duration:120,fill:'forwards'}));const t=setTimeout(jit,100+Math.random()*100);holdAnims.push({cancel:()=>clearTimeout(t)})};const t=setTimeout(jit,i*50);holdAnims.push({cancel:()=>clearTimeout(t)})})},
  // ── NEW ──
  glow(els){els.forEach(({el},i)=>{holdAnims.push(el.animate([{filter:'brightness(1) drop-shadow(0 0 0px transparent)'},{filter:'brightness(1.15) drop-shadow(0 0 8px rgba(255,255,255,.15))'},{filter:'brightness(1) drop-shadow(0 0 0px transparent)'}],{duration:2400,iterations:Infinity,easing:SILK,delay:i*200}))})},
  rotate(els){els.forEach(({el},i)=>{const d=i%2===0?1:-1;holdAnims.push(el.animate([{transform:'rotate(0deg)'},{transform:`rotate(${d*2}deg)`},{transform:'rotate(0deg)'}],{duration:3000,iterations:Infinity,easing:SILK,delay:i*300}))})},
  bounce(els){els.forEach(({el},i)=>{holdAnims.push(el.animate([{transform:'translateY(0)'},{transform:'translateY(-10px)'},{transform:'translateY(2px)'},{transform:'translateY(0)'}],{duration:1800,iterations:Infinity,easing:SILK,delay:i*120}))})},
};
function stopHold(){holdAnims.forEach(a=>{try{a.cancel()}catch(e){}});holdAnims=[]}

function isColorDark(hex){
  if(!hex||hex.length<7) return false;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return(r*299+g*587+b*114)/1000<128;
}

// ═══════════════════════════════════════════════════════
//  TOKENIZER
// ═══════════════════════════════════════════════════════
function tokenize(raw){
  const out=[];const re=/\[([^\]]+)\]|(\|)|(\S+)/g;let m;
  while((m=re.exec(raw))!==null){
    if(m[1]!=null){m[1].trim().split(/\s+/).forEach(w=>{const[base,color]=w.split('~');const[t,s]=base.split(':');out.push({text:t,size:s||'md',pill:true,isSplit:false,color:color||null})})}
    else if(m[2]!=null){out.push({isSplit:true})}
    else{const[base,color]=m[3].split('~');const[t,s]=base.split(':');out.push({text:t,size:s||'md',pill:false,isSplit:false,color:color||null})}
  }
  return out;
}

// Build word element
const SPACING_MAP={tight:'-0.02em',normal:'0',wide:'0.06em',ultra:'0.18em'};
function makeWord(tok,fw,sc){
  const fs=baseFS()*(SCALES[tok.size]||1);
  const el=document.createElement('span');
  el.className='w'+(tok.pill?' pill':'');
  let css=`font-size:${fs}px;font-weight:${fw};opacity:0;`;
  if(tok.color&&COLORS[tok.color]) css+=`color:${COLORS[tok.color]};`;
  if(sc.transform&&sc.transform!=='none') css+=`text-transform:${sc.transform};`;
  if(sc.spacing&&SPACING_MAP[sc.spacing]) css+=`letter-spacing:${SPACING_MAP[sc.spacing]};`;
  el.style.cssText=css;
  el.textContent=tok.text;
  return el;
}

function buildCentered(toks,sc){
  const wrap=document.createElement('div');
  const yPos=sc.textPos==='top'?'flex-start;padding-top:10%':'center';
  wrap.style.cssText=`position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:${yPos};justify-content:center;gap:.2em .34em;padding:6% 10%;z-index:2;`;
  const els=[];
  toks.filter(t=>!t.isSplit).forEach(t=>{const el=makeWord(t,sc.fw||'400',sc);wrap.appendChild(el);els.push({el,tok:t})});
  stage.appendChild(wrap);return els;
}

function buildSplit(toks,sc){
  const si=toks.findIndex(t=>t.isSplit);
  const left=si>=0?toks.slice(0,si):[],right=si>=0?toks.slice(si+1):[];
  const outer=document.createElement('div');
  outer.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 8%;z-index:2;';
  const lDiv=document.createElement('div');lDiv.style.cssText='display:flex;flex-wrap:wrap;gap:.2em .3em;';
  const rDiv=document.createElement('div');rDiv.style.cssText='display:flex;flex-wrap:wrap;gap:.2em .3em;justify-content:flex-end;';
  const els=[];
  left.forEach(t=>{const el=makeWord(t,sc.fw||'400',sc);lDiv.appendChild(el);els.push({el,tok:t})});
  right.forEach(t=>{const el=makeWord(t,sc.fw||'400',sc);rDiv.appendChild(el);els.push({el,tok:t})});
  outer.appendChild(lDiv);outer.appendChild(rDiv);stage.appendChild(outer);return els;
}

function drawStatic(i){
  clearStage();const sc=scenes[i];applyBg(sc.bg||'');
  const toks=tokenize(sc.text);
  const els=sc.split?buildSplit(toks,sc):buildCentered(toks,sc);
  els.forEach(({el})=>{el.style.opacity='1';el.style.transform='none';el.style.filter='none'});
  ctr.textContent=`${i+1} / ${scenes.length}`;prog.style.width='0%';
}

function animIn(els,sc,done){const s=spv();const fn=ENTER[sc.enter]||ENTER.gentle;const ms=fn(els,sc.fw);timers.push(setTimeout(done,Math.round(ms/s)))}
function animOut(els,sc,done){
  const s=spv();const fn=EXIT[sc.exit]||EXIT.fade;
  let targets=sc.exitPartial!=null?els.slice(0,sc.exitPartial).map(e=>e.el):els.map(e=>e.el);
  const ms=fn(targets);
  timers.push(setTimeout(()=>{targets.forEach(e=>{e.style.opacity='0';e.style.transform='';e.style.filter=''});done()},Math.round(ms/s)));
}

function playAll(){document.getElementById('idle').classList.add('gone');stopAll();curI=0;playing=true;updateBtn();runScene()}
function runScene(){
  if(curI>=scenes.length){stopAll();return}
  clearStage();const sc=scenes[curI];const toks=tokenize(sc.text);const s=spv();
  applyBg(sc.bg||'');ctr.textContent=`${curI+1} / ${scenes.length}`;renderTL();
  const holdMs=(sc.hold/s)*1000;
  prog.style.transition='none';prog.style.width='0%';prog.offsetHeight;
  prog.style.transition=`width ${holdMs/1000}s linear`;
  const els=sc.split?buildSplit(toks,sc):buildCentered(toks,sc);
  const next=()=>{curI++;timers.push(setTimeout(runScene,50))};
  animIn(els,sc,()=>{
    prog.style.width='100%';
    const holdFn=HOLD[sc.hold_anim||'none']||HOLD.none;holdFn(els,holdMs);
    timers.push(setTimeout(()=>{stopHold();prog.style.transition='none';animOut(els,sc,next)},holdMs));
  });
}
function togglePlay(){document.getElementById('idle').classList.add('gone');if(playing){stopAll();drawStatic(curI)}else{playing=true;updateBtn();runScene()}}
function stopAll(){playing=false;stopHold();timers.forEach(clearTimeout);timers=[];prog.style.transition='none';prog.style.width='0%';updateBtn()}
function go(dir){stopAll();curI=Math.max(0,Math.min(scenes.length-1,curI+dir));renderSB();drawStatic(curI)}
function updateBtn(){const ico=document.getElementById('pico');if(playing)ico.outerHTML=`<g id="pico"><rect x="5" y="4" width="4" height="16" fill="white"/><rect x="14" y="4" width="4" height="16" fill="white"/></g>`;else ico.outerHTML=`<polygon id="pico" points="5,3 20,12 5,21" fill="white"/>`}
function renderTL(){const tl=document.getElementById('tl');tl.innerHTML='';scenes.forEach((_,i)=>{const p=document.createElement('div');p.className='pip'+(i<curI?' d':i===curI?' c':'');p.onclick=()=>{stopAll();curI=i;renderSB();drawStatic(i)};tl.appendChild(p)})}

        <div class="sec${o('fw')}">
          <div class="sec-title" onclick="toggleSec('fw')">Font-vekt</div>
          <div class="sec-body"><div class="pr">${WEIGHTS.map(w=>`<button class="ap${(sc.fw||'400')===w?' s':''}" onclick="upd(${i},'fw','${w}');renderSB()">${w}</button>`).join('')}</div></div>
        </div>

        <div class="sec${o('transform')}">
          <div class="sec-title" onclick="toggleSec('transform')">Tekst-transform</div>
          <div class="sec-body"><div class="pr">${TRANSFORMS.map(t=>`<button class="ap${(sc.transform||'none')===t.k?' s':''}" onclick="upd(${i},'transform','${t.k}');renderSB()">${t.l}</button>`).join('')}</div></div>
        </div>

        <div class="sec${o('spacing')}">
          <div class="sec-title" onclick="toggleSec('spacing')">Bokstavmellomrom</div>
          <div class="sec-body"><div class="pr">${SPACINGS.map(s=>`<button class="ap${(sc.spacing||'normal')===s.k?' s':''}" onclick="upd(${i},'spacing','${s.k}');renderSB()">${s.l}</button>`).join('')}</div></div>
        </div>

        <div class="sec${o('layout')}">
          <div class="sec-title" onclick="toggleSec('layout')">Layout</div>
          <div class="sec-body"><div class="pr">
            <button class="ap${!sc.split?' s':''}" onclick="upd(${i},'split',false);renderSB()">Sentrert</button>
            <button class="ap${sc.split?' s':''}" onclick="upd(${i},'split',true);renderSB()">Split |</button>
          </div></div>
        </div>

        <div class="sec${o('bg')}">
          <div class="sec-title" onclick="toggleSec('bg')">Bakgrunnsfarge</div>
          <div class="sec-body"><div class="bg-row">
            ${BGS.map(b=>`<div class="bg-sw${b.product?' product-sw':''}${curBg===b.k?' s':''}" style="background:${b.c}" title="${b.l}" onclick="upd(${i},'bg','${b.k}');renderSB()"></div>`).join('')}
            <input type="color" class="bg-custom" value="${isCustom?curBg:'#0a0a0a'}" title="Egendefinert farge" onchange="upd(${i},'bg',this.value);renderSB()">
          </div></div>
        </div>

        <div class="sec${o('time')}">
          <div class="sec-title" onclick="toggleSec('time')">Visningstid</div>
          <div class="sec-body"><div style="display:flex;align-items:center;gap:8px">
            <input type="range" min=".5" max="6" step=".25" value="${sc.hold}" style="flex:1;accent-color:var(--ink)"
              oninput="upd(${i},'hold',parseFloat(this.value));calcTime();this.nextElementSibling.textContent=this.value+'s'">
            <span class="rv">${sc.hold}s</span>
          </div></div>
        </div>

        ${scenes.length>1?`<button class="sdel" onclick="delScene(${i})">Slett scene</button>`:''}
      </div>`;
    }

    card.innerHTML=html;
    list.appendChild(card);
  });
  const ab=document.createElement('button');
  ab.className='addbtn';ab.textContent='+ Legg til scene';ab.onclick=addScene;
  list.appendChild(ab);
  renderTL();calcTime();
}

function upd(i,k,v){scenes[i][k]=v;if(!playing)drawStatic(i)}
function selectScene(i){stopAll();curI=i;renderSB();drawStatic(i)}
function addScene(){
  scenes.push({text:'Din tekst her',enter:'gentle',exit:'fade',hold_anim:'none',fw:'400',hold:2.0,bg:'',transform:'none',spacing:'normal'});
  selectScene(scenes.length-1);
}
function delScene(i){
  if(scenes.length<=1)return;scenes.splice(i,1);
  curI=Math.min(curI,scenes.length-1);renderSB();drawStatic(curI);
}
function calcTime(){
  const s=spv();const tot=scenes.reduce((a,sc)=>a+sc.hold,0)/s;
  const m=Math.floor(tot/60),sec=Math.round(tot%60);
  document.getElementById('tt').textContent=`${m}:${sec.toString().padStart(2,'0')}`;
}

window.addEventListener('resize',()=>{if(!playing)drawStatic(curI)});
renderSB();setTimeout(()=>drawStatic(0),60);
</script>
</body>
</html>
